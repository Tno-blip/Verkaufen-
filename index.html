<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéMarkt DE — Premium TCG Marktplatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg0:#060609;--bg1:#0d0d14;--bg2:#13131e;--bg3:#1a1a2a;--bg4:#222235;--gold:#F0A500;--goldd:#C87800;--goldl:#FFD060;--tp:#F0EDE8;--ts:#A09898;--tm:#5A5565;--bdr:rgba(240,165,0,0.15);--bdrh:rgba(240,165,0,0.4);--red:#FF4040;--green:#00C875;--blue:#4A90E2;--purple:#8B5CF6}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:'Rajdhani',sans-serif;background:var(--bg0);color:var(--tp);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--goldd);border-radius:3px}
#nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(6,6,9,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);height:60px;display:flex;align-items:center;padding:0 1.5rem;gap:1.5rem}
.nlogo{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:900;color:var(--gold);cursor:pointer;letter-spacing:2px;flex-shrink:0}
.nlogo span{color:var(--tp)}
.nlinks{display:flex;gap:0.2rem;flex:1}
.nl{padding:0.45rem 0.85rem;cursor:pointer;color:var(--ts);font-size:0.82rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;border-radius:5px;transition:all 0.18s}
.nl:hover,.nl.act{color:var(--gold);background:rgba(240,165,0,0.08)}
.nright{display:flex;align-items:center;gap:0.6rem;flex-shrink:0}
.btn{padding:0.45rem 1.1rem;border-radius:5px;border:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:0.82rem;letter-spacing:1px;text-transform:uppercase;transition:all 0.18s}
.btnp{background:var(--gold);color:#000}.btnp:hover{background:var(--goldl);transform:translateY(-1px)}
.btno{background:transparent;color:var(--gold);border:1px solid var(--gold)}.btno:hover{background:rgba(240,165,0,0.1)}
.btng{background:var(--bg3);color:var(--tp);border:1px solid var(--bdr)}.btng:hover{border-color:var(--bdrh)}
.btnd{background:var(--red);color:#fff}.btnd:hover{filter:brightness(1.1)}
.btns{background:var(--green);color:#000}.btns:hover{filter:brightness(1.1)}
.cbadge{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;font-size:9px;font-weight:800;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#content{padding-top:60px;min-height:100vh}
.hero{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 2rem;position:relative;overflow:hidden}
.hbg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(240,165,0,0.07) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 20% 80%,rgba(139,92,246,0.05) 0%,transparent 50%),radial-gradient(ellipse 40% 40% at 80% 80%,rgba(74,144,226,0.05) 0%,transparent 50%)}
.hgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(240,165,0,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(240,165,0,0.025) 1px,transparent 1px);background-size:60px 60px}
.heyebrow{font-size:0.72rem;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:1.5rem;font-weight:600}
.htitle{font-family:'Orbitron',monospace;font-size:clamp(2.2rem,5.5vw,4.5rem);font-weight:900;line-height:1.05;margin-bottom:1.5rem}
.htitle .g{color:var(--gold)}
.hsub{font-size:1.1rem;color:var(--ts);max-width:580px;margin:0 auto 2.5rem;font-weight:400;line-height:1.6}
.hacts{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:4rem}
.hbtnp{background:var(--gold);color:#000;padding:0.85rem 2.2rem;border-radius:7px;border:none;font-family:'Orbitron',monospace;font-weight:700;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s}
.hbtnp:hover{background:var(--goldl);transform:translateY(-2px)}
.hbtns{background:transparent;color:var(--tp);padding:0.85rem 2.2rem;border-radius:7px;border:1px solid rgba(240,165,0,0.3);font-family:'Orbitron',monospace;font-weight:700;font-size:0.78rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s}
.hbtns:hover{border-color:var(--gold);color:var(--gold)}
.sbar{display:flex;gap:3.5rem;justify-content:center;flex-wrap:wrap}
.sitem{text-align:center}
.snum{font-family:'Orbitron',monospace;font-size:1.7rem;font-weight:700;color:var(--gold)}
.slbl{font-size:0.7rem;color:var(--tm);text-transform:uppercase;letter-spacing:2px;margin-top:0.25rem}
.sec{padding:5rem 2rem;max-width:1400px;margin:0 auto}
.sech{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2.5rem}
.sect{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700} .sect span{color:var(--gold)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.1rem}
.pcard{background:var(--bg2);border:1px solid var(--bdr);border-radius:11px;overflow:hidden;cursor:pointer;transition:all 0.22s;position:relative}
.pcard:hover{transform:translateY(-5px);border-color:var(--bdrh);box-shadow:0 14px 45px rgba(240,165,0,0.13)}
.cimg{height:155px;display:flex;align-items:center;justify-content:center;font-size:4.5rem;position:relative;overflow:hidden}
.cbody{padding:0.9rem}
.cname{font-family:'Orbitron',monospace;font-size:0.68rem;font-weight:700;color:var(--tp);margin-bottom:0.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cset{font-size:0.72rem;color:var(--tm);margin-bottom:0.45rem}
.ctags{display:flex;gap:0.3rem;flex-wrap:wrap;margin-bottom:0.65rem}
.tag{font-size:0.6rem;font-weight:700;padding:2px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:0.5px}
.cftr{display:flex;align-items:center;justify-content:space-between}
.cprice{font-family:'Orbitron',monospace;font-size:0.95rem;font-weight:700;color:var(--gold)}
.ccond{font-size:0.68rem;color:var(--tm);font-weight:600}
.fbadge{position:absolute;top:9px;left:9px;background:var(--gold);color:#000;font-size:0.58rem;font-weight:800;padding:2px 7px;border-radius:3px;letter-spacing:1px;text-transform:uppercase}
/* Wishlist heart button */
.wl-btn{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:0.85rem;cursor:pointer;transition:all 0.2s;z-index:2}
.wl-btn:hover{background:rgba(255,64,64,0.2);border-color:rgba(255,64,64,0.4);transform:scale(1.15)}
.wl-btn.active{background:rgba(255,64,64,0.25);border-color:rgba(255,64,64,0.5)}
.shop-layout{display:grid;grid-template-columns:250px 1fr;gap:2rem;max-width:1400px;margin:0 auto;padding:1.5rem 2rem}
.fpanel{background:var(--bg1);border:1px solid var(--bdr);border-radius:11px;padding:1.4rem;height:fit-content;position:sticky;top:78px}
.ftitle{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:0.8rem;margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--bdr)}
.ftitle:first-child{margin-top:0;padding-top:0;border-top:none}
.fopt{display:flex;align-items:center;gap:0.45rem;padding:0.35rem 0.45rem;border-radius:5px;cursor:pointer;font-size:0.82rem;color:var(--ts);transition:all 0.13s}
.fopt:hover,.fopt.act{background:rgba(240,165,0,0.08);color:var(--gold)}
.fdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sbox{width:100%;background:var(--bg3);border:1px solid var(--bdr);border-radius:7px;padding:0.7rem 0.9rem;color:var(--tp);font-family:'Rajdhani',sans-serif;font-size:0.92rem;outline:none;transition:border-color 0.18s}
.sbox:focus{border-color:var(--gold)}.sbox::placeholder{color:var(--tm)}
.shop-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.3rem;flex-wrap:wrap;gap:0.8rem}
.rcnt{font-size:0.85rem;color:var(--ts)}
.ssort{background:var(--bg3);border:1px solid var(--bdr);border-radius:7px;padding:0.45rem 0.9rem;color:var(--tp);font-family:'Rajdhani',sans-serif;font-size:0.88rem;outline:none;cursor:pointer}
.cdl{max-width:980px;margin:0 auto;padding:2.5rem 2rem;display:grid;grid-template-columns:1fr 1.4fr;gap:3rem}
.cdisplay{background:var(--bg2);border-radius:15px;border:1px solid var(--bdr);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;gap:1rem}
.cdisplay-em{font-size:8rem;filter:drop-shadow(0 0 30px rgba(240,165,0,0.25))}
.ci-panel{padding:0.5rem 0}
.cdn{font-family:'Orbitron',monospace;font-size:1.5rem;font-weight:900;margin-bottom:0.4rem;line-height:1.2}
.cdset{color:var(--ts);margin-bottom:1.3rem;font-size:0.95rem}
.cdprice{font-family:'Orbitron',monospace;font-size:2.3rem;font-weight:900;color:var(--gold);margin-bottom:0.3rem}
.cdpnote{font-size:0.77rem;color:var(--tm);margin-bottom:1.8rem}
.cspecs{display:grid;grid-template-columns:1fr 1fr;gap:0.65rem;margin-bottom:1.8rem;background:var(--bg2);border-radius:9px;border:1px solid var(--bdr);padding:1rem}
.spec-l{font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--tm);margin-bottom:0.15rem}
.spec-v{font-size:0.88rem;font-weight:600;color:var(--tp)}
.sinfo{background:var(--bg2);border:1px solid var(--bdr);border-radius:9px;padding:0.9rem;display:flex;align-items:center;gap:0.9rem;margin-bottom:1.4rem;cursor:pointer;transition:border-color 0.18s}
.sinfo:hover{border-color:var(--bdrh)}
.sav{width:38px;height:38px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;border:1px solid var(--bdr)}
.snm{font-weight:700;font-size:0.9rem}
.smt{font-size:0.72rem;color:var(--tm)}
.svbadge{font-size:0.65rem;color:var(--green);font-weight:700;background:rgba(0,200,117,0.1);padding:2px 6px;border-radius:3px;margin-left:auto}
.cart-l{max-width:860px;margin:0 auto;padding:2.5rem 2rem;display:grid;grid-template-columns:1fr 320px;gap:2rem}
.citem{background:var(--bg2);border:1px solid var(--bdr);border-radius:11px;padding:1.1rem;display:flex;gap:1.1rem;align-items:center;margin-bottom:0.7rem}
.citem-em{font-size:2.3rem;flex-shrink:0}
.citem-info{flex:1}
.citem-nm{font-family:'Orbitron',monospace;font-size:0.68rem;font-weight:700;margin-bottom:0.2rem}
.citem-mt{font-size:0.77rem;color:var(--tm)}
.citem-pr{font-family:'Orbitron',monospace;font-size:0.95rem;font-weight:700;color:var(--gold);white-space:nowrap}
.osum{background:var(--bg2);border:1px solid var(--bdr);border-radius:11px;padding:1.4rem;height:fit-content;position:sticky;top:78px}
.osum-t{font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:1.3rem}
.sline{display:flex;justify-content:space-between;margin-bottom:0.65rem;font-size:0.88rem}
.sline.tot{margin-top:0.9rem;padding-top:0.9rem;border-top:1px solid var(--bdr);font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:700;color:var(--gold)}
.auth-pg{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:2rem;background:radial-gradient(ellipse 60% 60% at 30% 50%,rgba(240,165,0,0.04) 0%,transparent 70%),radial-gradient(ellipse 40% 40% at 70% 50%,rgba(139,92,246,0.03) 0%,transparent 60%)}
.acard{background:var(--bg1);border:1px solid var(--bdr);border-radius:15px;padding:2.3rem;width:100%;max-width:410px}
.atitle{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:700;text-align:center;margin-bottom:0.4rem}
.asub{text-align:center;color:var(--tm);font-size:0.82rem;margin-bottom:1.8rem}
.fg{margin-bottom:1.1rem}
.fl{display:block;font-size:0.7rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ts);margin-bottom:0.4rem}
.fi{width:100%;background:var(--bg3);border:1px solid var(--bdr);border-radius:7px;padding:0.7rem 0.9rem;color:var(--tp);font-family:'Rajdhani',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.18s}
.fi:focus{border-color:var(--gold)}.fi::placeholder{color:var(--tm)}
.aerr{background:rgba(255,64,64,0.1);border:1px solid rgba(255,64,64,0.3);border-radius:7px;padding:0.7rem 0.9rem;color:var(--red);font-size:0.82rem;margin-bottom:1.1rem}
.aok{background:rgba(0,200,117,0.1);border:1px solid rgba(0,200,117,0.3);border-radius:7px;padding:0.7rem 0.9rem;color:var(--green);font-size:0.82rem;margin-bottom:1.1rem}
.admin-l{max-width:1400px;margin:0 auto;padding:2rem}
.admin-t{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:700;color:var(--gold);margin-bottom:0.4rem}
.atabs{display:flex;gap:0.4rem;border-bottom:1px solid var(--bdr);margin-bottom:2rem;flex-wrap:wrap}
.atab{padding:0.7rem 1.3rem;cursor:pointer;font-size:0.8rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tm);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.18s}
.atab:hover,.atab.act{color:var(--gold);border-bottom-color:var(--gold)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-bottom:2rem}
.sc{background:var(--bg2);border:1px solid var(--bdr);border-radius:11px;padding:1.4rem}
.sc-l{font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;color:var(--tm);margin-bottom:0.65rem}
.sc-n{font-family:'Orbitron',monospace;font-size:1.7rem;font-weight:700}
.sc-c{font-size:0.77rem;margin-top:0.45rem}
.dtbl{width:100%;border-collapse:collapse;font-size:0.82rem}
.dtbl th{background:var(--bg2);padding:0.7rem 0.9rem;text-align:left;font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--tm);border-bottom:1px solid var(--bdr)}
.dtbl td{padding:0.85rem 0.9rem;border-bottom:1px solid rgba(240,165,0,0.04);color:var(--ts)}
.dtbl tr:hover td{background:rgba(240,165,0,0.02)}
.tblw{background:var(--bg2);border:1px solid var(--bdr);border-radius:11px;overflow:hidden;overflow-x:auto}
.rbadge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.ra{background:rgba(240,165,0,0.15);color:var(--gold)}
.rs{background:rgba(74,144,226,0.15);color:var(--blue)}
.ru{background:rgba(160,152,152,0.15);color:var(--ts)}
.abtn{padding:3px 9px;border-radius:3px;border:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:0.72rem;letter-spacing:0.5px;transition:all 0.13s}
.ab-ban{background:rgba(255,64,64,0.15);color:var(--red)}.ab-ban:hover{background:rgba(255,64,64,0.25)}
.ab-ok{background:rgba(0,200,117,0.15);color:var(--green)}.ab-ok:hover{background:rgba(0,200,117,0.25)}
.ab-ft{background:rgba(240,165,0,0.15);color:var(--gold)}.ab-ft:hover{background:rgba(240,165,0,0.25)}
.ab-rm{background:rgba(255,64,64,0.12);color:var(--red)}.ab-rm:hover{background:rgba(255,64,64,0.22)}
.ab-cr{background:rgba(139,92,246,0.15);color:var(--purple)}.ab-cr:hover{background:rgba(139,92,246,0.25)}
#notifs{position:fixed;bottom:1.8rem;right:1.8rem;z-index:9999;display:flex;flex-direction:column;gap:0.65rem;pointer-events:none}
.notif{background:var(--bg2);border:1px solid var(--bdr);border-radius:9px;padding:0.9rem 1.1rem;max-width:300px;display:flex;align-items:flex-start;gap:0.65rem;pointer-events:all;animation:slin 0.28s ease;border-left:3px solid var(--gold)}
.notif.ok{border-left-color:var(--green)}.notif.err{border-left-color:var(--red)}
.ni{font-size:1rem;flex-shrink:0}.nt{font-size:0.82rem;flex:1}
.ntit{font-weight:700;margin-bottom:0.12rem}.nmsg{color:var(--tm);font-size:0.77rem}
@keyframes slin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.ppage{max-width:970px;margin:0 auto;padding:2.5rem 2rem;display:grid;grid-template-columns:270px 1fr;gap:2rem}
.pcard2{background:var(--bg2);border:1px solid var(--bdr);border-radius:11px;padding:1.8rem;text-align:center;margin-bottom:1.1rem}
.pav{font-size:3.5rem;margin-bottom:0.9rem;cursor:pointer;transition:transform 0.2s}.pav:hover{transform:scale(1.1)}
.pun{font-family:'Orbitron',monospace;font-size:0.9rem;font-weight:700;margin-bottom:0.2rem}
.pem{font-size:0.77rem;color:var(--tm);margin-bottom:0.9rem}
.pbal{font-family:'Orbitron',monospace;font-size:1.4rem;color:var(--gold);font-weight:700}
.pbl{font-size:0.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-top:0.2rem}
.psgrid{display:grid;grid-template-columns:1fr 1fr;gap:0.65rem;margin-bottom:0.9rem}
.ps{background:var(--bg3);border-radius:7px;padding:0.65rem;text-align:center}
.ps-n{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700}
.ps-l{font-size:0.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-top:0.18rem}
.sell-pg{max-width:680px;margin:0 auto;padding:2.5rem 2rem}
.sell-t{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:700;margin-bottom:0.4rem}
.sell-s{color:var(--tm);margin-bottom:1.8rem}
.sform{background:var(--bg1);border:1px solid var(--bdr);border-radius:15px;padding:1.8rem}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.fsel{width:100%;background:var(--bg3);border:1px solid var(--bdr);border-radius:7px;padding:0.7rem 0.9rem;color:var(--tp);font-family:'Rajdhani',sans-serif;font-size:0.95rem;outline:none;cursor:pointer}
.fsel:focus{border-color:var(--gold)}
.opage{max-width:860px;margin:0 auto;padding:2.5rem 2rem}
.ocrd{background:var(--bg2);border:1px solid var(--bdr);border-radius:11px;padding:1.4rem;margin-bottom:0.9rem}
.ohdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.9rem;padding-bottom:0.9rem;border-bottom:1px solid var(--bdr)}
.oid{font-family:'Orbitron',monospace;font-size:0.72rem;color:var(--gold)}
.odt{font-size:0.77rem;color:var(--tm)}
.ost{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 9px;border-radius:3px}
.st-p{background:rgba(245,158,11,0.15);color:#F59E0B}
.st-s{background:rgba(74,144,226,0.15);color:var(--blue)}
.st-d{background:rgba(0,200,117,0.15);color:var(--green)}
.empty{text-align:center;padding:5rem 2rem}
.empty-ic{font-size:3.5rem;margin-bottom:1.3rem}
.empty-t{font-family:'Orbitron',monospace;font-size:1.1rem;margin-bottom:0.65rem}
.empty-tx{color:var(--tm);margin-bottom:1.8rem}
.holo{background:linear-gradient(135deg,rgba(240,165,0,0.05) 0%,rgba(139,92,246,0.05) 25%,rgba(74,144,226,0.05) 50%,rgba(240,165,0,0.05) 75%,rgba(0,200,117,0.05) 100%);background-size:200% 200%;animation:holo 4s linear infinite}
@keyframes holo{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.ldot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;margin-right:5px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8rem}

// ===================== TOASTS & NOTIFICATIONS =====================
let _nid=S.nid||0;
function toast(title,msg,type='info'){
  const id=++_nid;S.nid=_nid;
  S.notifHistory.unshift({id,title,msg,type,time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),read:false});
  if(S.notifHistory.length>50)S.notifHistory=S.notifHistory.slice(0,50);
  const icons={'info':'🔔','ok':'✅','err':'❌'};
  const el=document.createElement('div');
  el.className='notif'+(type==='ok'?' ok':type==='err'?' err':'');
  el.innerHTML=`<span class="ni">${icons[type]||'🔔'}</span><div class="nt"><div class="ntit">${title}</div><div class="nmsg">${msg}</div></div>`;
  document.getElementById('notifs').appendChild(el);
  setTimeout(()=>el.remove(),4200);
  updateBell();saveState();
}
function updateBell(){
  const unread=S.notifHistory.filter(n=>!n.read).length;
  const bell=document.getElementById('bell-badge');
  if(bell)bell.textContent=unread>0?unread:'';
  if(bell)bell.style.display=unread>0?'flex':'none';
}
function openNotifDrop(){
  S.showNotifDrop=!S.showNotifDrop;
  if(S.showNotifDrop){S.notifHistory.forEach(n=>n.read=true);saveState();}
  renderNav();
  document.getElementById('notif-overlay').style.display=S.showNotifDrop?'block':'none';
}
function closeNotifDrop(){S.showNotifDrop=false;renderNav();document.getElementById('notif-overlay').style.display='none';}

function loginUser(em,pw){
  const u=S.users.find(x=>x.em===em&&x.pw===pw);
  if(!u){S.loginErr='E-Mail oder Passwort falsch';render();return;}
  if(u.banned){S.loginErr='Dein Konto ist gesperrt. Kontaktiere den Support.';render();return;}
  S.user={...u};S.loginErr='';saveState();
  toast('Willkommen zurück! 👋','Hallo '+u.un,'ok');
  renderNav();go('home');
}
function registerUser(un,em,pw){
  if(S.users.find(u=>u.em===em)){S.regErr='E-Mail bereits registriert';render();return;}
  if(S.users.find(u=>u.un===un)){S.regErr='Benutzername bereits vergeben';render();return;}
  if(pw.length<6){S.regErr='Passwort mind. 6 Zeichen';render();return;}
  if(!/^[a-zA-Z0-9_äöüÄÖÜ]{3,20}$/.test(un)){S.regErr='Benutzername: 3-20 Zeichen, nur Buchstaben/Zahlen/_';render();return;}
  const nu={id:S.users.length+100+Math.floor(Math.random()*100),un,em,pw,role:'user',bal:100.00,joined:new Date().toLocaleDateString('de-DE'),av:'🎴',ver:false,sales:0,buys:0,banned:false};
  S.users.push(nu);S.user={...nu};S.regErr='';saveState();
  addSysNotif('Konto erstellt','Willkommen '+un+'! Du hast 100€ Startguthaben erhalten. 🎉');
  toast('Konto erstellt! 🎉','Willkommen '+un+'! 100€ Startguthaben gutgeschrieben','ok');
  renderNav();go('home');
}
function logout(){S.user=null;S.cart=[];saveState();renderNav();go('home');toast('Abgemeldet','Bis bald! 👋');}
function addSysNotif(title,msg){
  S.notifHistory.unshift({id:++_nid,title,msg,type:'ok',time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),read:false});
}

// ===================== CART & CHECKOUT =====================
function addCart(id){
  const c=S.cards.find(x=>x.id===id);
  if(!c)return;
  if(!S.user){toast('Login erforderlich','Bitte anmelden um zu kaufen','err');go('login');return;}
  if(c.stock===0){toast('Nicht verfügbar','Diese Karte ist nicht mehr auf Lager','err');return;}
  if(S.cart.find(i=>i.id===id)){toast('Bereits im Warenkorb',c.name+' ist schon drin');return;}
  S.cart.push({id,price:c.price});saveState();
  toast('Hinzugefügt ✓',c.name+' im Warenkorb','ok');
  renderNav();
}
function rmCart(id){S.cart=S.cart.filter(i=>i.id!==id);S.appliedPromo=null;saveState();render();}
function applyPromo(code){
  const pc=S.promoCodes.find(p=>p.code===code.toUpperCase()&&p.active&&p.uses>0);
  if(!pc){toast('Ungültiger Code','Dieser Promo-Code existiert nicht oder ist abgelaufen','err');return;}
  S.appliedPromo={code:pc.code,discount:pc.discount};
  pc.uses--;saveState();
  toast('Promo-Code aktiviert! 🎉',pc.discount+'% Rabatt angewendet','ok');
  render();
}
function removePromo(){S.appliedPromo=null;saveState();render();}
function checkout(){
  let total=S.cart.reduce((s,i)=>s+i.price,0);
  const fee=total*(S.settings.fee/100);
  total+=fee;
  if(S.appliedPromo)total=total*(1-S.appliedPromo.discount/100);
  if(!S.user){go('login');return;}
  if(S.user.bal<total){toast('Guthaben reicht nicht','Bitte lade Guthaben auf','err');return;}
  const oid='PM-'+Date.now().toString(36).toUpperCase();
  const items=S.cart.map(i=>{const c=S.cards.find(x=>x.id===i.id);return{id:i.id,name:c.name,price:i.price,em:c.em,sellerId:c.sellerId};});
  S.orders.push({id:oid,userId:S.user.id,items,total,status:'pending',date:new Date().toLocaleDateString('de-DE'),rated:false});
  const ui=S.users.findIndex(u=>u.id===S.user.id);
  S.users[ui].bal-=total;S.users[ui].buys+=S.cart.length;
  S.user={...S.users[ui]};
  S.cart.forEach(i=>{const ci=S.cards.findIndex(c=>c.id===i.id);if(ci!==-1)S.cards[ci].stock=Math.max(0,S.cards[ci].stock-1);});
  S.cart=[];S.appliedPromo=null;saveState();
  toast('Bestellung aufgegeben! 🎉','Bestellung '+oid+' bestätigt','ok');
  addSysNotif('Bestellung bestätigt','Deine Bestellung '+oid+' wird bearbeitet.');
  go('orders');
}

function toggleWishlist(id,e){

// ===================== CARDS =====================
function listCard(d){
  if(!S.user){go('login');return;}
  if(!S.settings.allowSellers&&S.user.role!=='admin'){toast('Nicht erlaubt','Verkäufe sind aktuell deaktiviert','err');return;}
  if(d.price>S.settings.maxListPrice){toast('Preis zu hoch',`Max. Listenpreis: ${fmt(S.settings.maxListPrice)}`,'err');return;}
  const nc={id:Date.now(),...d,seller:S.user.un,sellerId:S.user.id,feat:false,stock:1,views:0,likes:0};
  S.cards.push(nc);
  const ui=S.users.findIndex(u=>u.id===S.user.id);
  S.users[ui].sales+=1;S.user={...S.users[ui]};
  if(S.user.role==='user'){const idx=S.users.findIndex(u=>u.id===S.user.id);S.users[idx].role='seller';S.user.role='seller';}
  saveState();
  toast('Karte eingestellt! 🃏',d.name+' ist jetzt im Marktplatz','ok');
  go('shop');
}

function filteredCards(){
  let c=[...S.cards];
  if(S.q){const q=S.q.toLowerCase();c=c.filter(x=>x.name.toLowerCase().includes(q)||x.set.toLowerCase().includes(q)||x.seller.toLowerCase().includes(q));}
  if(S.fRarity!=='all')c=c.filter(x=>x.rarity===S.fRarity);
  if(S.fType!=='all')c=c.filter(x=>x.type===S.fType);
  if(S.fCond!=='all')c=c.filter(x=>x.condition.includes(S.fCond));
  c=c.filter(x=>x.price<=S.priceMax);
  if(S.sort==='price-asc')c.sort((a,b)=>a.price-b.price);
  else if(S.sort==='price-desc')c.sort((a,b)=>b.price-a.price);
  else if(S.sort==='newest')c.sort((a,b)=>b.id-a.id);
  else if(S.sort==='popular')c.sort((a,b)=>b.views-a.views);
  else c.sort((a,b)=>(b.feat?1:0)-(a.feat?1:0));
  return c;
}

function rtag(r){const cfg=RC[r]||{c:'#888',bg:'#333'};return`<span class="tag" style="background:${cfg.bg};color:${cfg.c}">${r}</span>`;}
function ttag(t){const cfg=TC[t]||{c:'#888',bg:'#333'};return`<span class="tag" style="background:${cfg.bg};color:${cfg.c}">${t}</span>`;}
function ctag(c){const col=CC[c]||'#999';return`<span class="tag" style="background:${col}22;color:${col}">${c}</span>`;}

function cbg(rarity){
  if(rarity==='Rainbow Rare')return'style="background:linear-gradient(135deg,#1a0a2e,#0a1a3a,#0a2a1a,#2a1a0a);background-size:200% 200%;animation:holo 4s linear infinite"';
  if(rarity==='Secret Rare')return'style="background:linear-gradient(135deg,#2a0808,#180808)"';
  if(rarity==='Ultra Rare')return'style="background:linear-gradient(135deg,#2a1a00,#1a1000)"';
  if(rarity==='Holo Rare')return'style="background:linear-gradient(135deg,#1a0a2e,0a0a1e)"';
  return'style="background:var(--bg3)"';
}

function pCard(c){
  const inWl=S.wishlist.includes(c.id);
  return`<div class="pcard ${c.rarity==='Rainbow Rare'?'holo':''}" onclick="showCard(${c.id})">
    ${c.feat?'<div class="fbadge">⭐ Featured</div>':''}
    <div class="wl-btn ${inWl?'active':''}" data-id="${c.id}" onclick="toggleWishlist(${c.id},event)" title="Merken">${inWl?'♥':'♡'}</div>
    <div class="cimg" ${cbg(c.rarity)}><span style="font-size:4.5rem">${c.em}</span></div>
    <div class="cbody">
      <div class="cname">${c.name}</div>
      <div class="cset">${c.set}</div>
      <div class="ctags">${rtag(c.rarity)}${ttag(c.type)}</div>
      <div class="cftr"><div class="cprice">${fmt(c.price)}</div><div class="ccond">${c.stock===0?'<span style="color:var(--red)">Ausverkauft</span>':c.condition}</div></div>
    </div>
  </div>`;
}

function starsHtml(rating,interactive=false,target=''){
  const stars=['⭐','⭐','⭐','⭐','⭐'];
  return stars.map((s,i)=>`<span class="star ${interactive?'':'star-sm'}" ${interactive?`onclick="setRating(${i+1},${target})" onmouseover="hoverRating(${i+1})" onmouseout="resetRating()"`:''} style="opacity:${i<rating?'1':'0.25'}" id="${interactive?`star-${i+1}`:''}">${s}</span>`).join('');
}
function setRating(r){S.reviewRating=r;document.querySelectorAll('.star').forEach((s,i)=>s.style.opacity=i<r?'1':'0.25');}
function hoverRating(r){document.querySelectorAll('.star').forEach((s,i)=>s.style.opacity=i<r?'1':'0.3');}
function resetRating(){document.querySelectorAll('.star').forEach((s,i)=>s.style.opacity=i<S.reviewRating?'1':'0.25');}
function sellerAvgRating(sellerId){
  const r=S.reviews.filter(x=>x.sellerId===sellerId);
  if(!r.length)return null;
  return r.reduce((s,x)=>s+x.rating,0)/r.length;
}
function submitReview(sellerId){

  S.reviews.push({id:Date.now(),userId:S.user.id,sellerId,rating:S.reviewRating,text:txt,user:S.user.un,date:new Date().toLocaleDateString('de-DE')});

function pageShop(){
  const rarities=[...new Set(S.cards.map(c=>c.rarity))];
  const types=[...new Set(S.cards.map(c=>c.type))];
  const allCards=filteredCards();
  const perPage=15;
  const totalPages=Math.max(1,Math.ceil(allCards.length/perPage));
  if(S.shopPage>totalPages)S.shopPage=1;
  const cards=allCards.slice((S.shopPage-1)*perPage,S.shopPage*perPage);
  return`<div class="page-in" style="padding-top:1.2rem">
    <div class="shop-layout">
      <aside class="fpanel">
        <input class="sbox" type="text" placeholder="🔍 Karten, Sets, Händler..." value="${S.q}" oninput="S.q=this.value;S.shopPage=1;shopRefresh()">
        <div class="ftitle">Seltenheit</div>
        <div class="fopt ${S.fRarity==='all'?'act':''}" onclick="S.fRarity='all';S.shopPage=1;shopRefresh()"><span class="fdot" style="background:#888"></span>Alle</div>
        ${rarities.map(r=>{const cfg=RC[r]||{c:'#888'};return`<div class="fopt ${S.fRarity===r?'act':''}" onclick="S.fRarity='${r}';S.shopPage=1;shopRefresh()"><span class="fdot" style="background:${cfg.c}"></span>${r}</div>`;}).join('')}
        <div class="ftitle">Typ</div>
        <div class="fopt ${S.fType==='all'?'act':''}" onclick="S.fType='all';S.shopPage=1;shopRefresh()"><span class="fdot" style="background:#888"></span>Alle</div>
        ${types.map(t=>{const cfg=TC[t]||{c:'#888'};return`<div class="fopt ${S.fType===t?'act':''}" onclick="S.fType='${t}';S.shopPage=1;shopRefresh()"><span class="fdot" style="background:${cfg.c}"></span>${t}</div>`;}).join('')}
        <div class="ftitle">Zustand</div>
        ${['all','PSA','NM','LP','MP','HP'].map(c=>`<div class="fopt ${S.fCond===c?'act':''}" onclick="S.fCond='${c}';S.shopPage=1;shopRefresh()"><span class="fdot" style="background:${c==='all'?'#888':CC[c]||'#888'}"></span>${c==='all'?'Alle':c}</div>`).join('')}
        <div class="ftitle">Max. Preis</div>
        <div style="padding:0 0.3rem">
          <input type="range" class="rng" min="0" max="3000" value="${S.priceMax}" step="50" oninput="S.priceMax=+this.value;S.shopPage=1;document.getElementById('pdis').textContent=this.value+'€';shopRefresh()">
          <div class="rngl"><span>0€</span><span id="pdis">${S.priceMax}€</span></div>
        </div>
        <hr class="divl">
        <button class="btn btng" style="width:100%" onclick="S.q='';S.fRarity='all';S.fType='all';S.fCond='all';S.priceMax=3000;S.sort='featured';S.shopPage=1;go('shop')">Filter zurücksetzen</button>
      </aside>
      <div>
        <div class="shop-hdr">
          <div class="rcnt"><span class="ldot"></span>${allCards.length} Karten gefunden — Seite ${S.shopPage}/${totalPages}</div>
          <select class="ssort" onchange="S.sort=this.value;S.shopPage=1;shopRefresh()">
            <option value="featured" ${S.sort==='featured'?'selected':''}>Featured zuerst</option>
            <option value="popular" ${S.sort==='popular'?'selected':''}>Beliebtheit</option>
            <option value="price-asc" ${S.sort==='price-asc'?'selected':''}>Preis aufsteigend</option>
            <option value="price-desc" ${S.sort==='price-desc'?'selected':''}>Preis absteigend</option>
            <option value="newest" ${S.sort==='newest'?'selected':''}>Neueste zuerst</option>
          </select>
        </div>
        ${cards.length===0?`<div class="empty"><div class="empty-ic">🔍</div><div class="empty-t">Keine Karten gefunden</div><div class="empty-tx">Versuche andere Filter oder Suchbegriffe</div></div>`:`<div class="cgrid" id="cg">${cards.map(pCard).join('')}</div>`}
        ${totalPages>1?`<div class="pag">
          <button class="pag-btn" onclick="S.shopPage=Math.max(1,S.shopPage-1);shopRefresh()" ${S.shopPage===1?'disabled':''}>← Zurück</button>
          ${Array.from({length:totalPages},(_, i)=>`<button class="pag-btn ${S.shopPage===i+1?'act':''}" onclick="S.shopPage=${i+1};shopRefresh()">${i+1}</button>`).join('')}
          <button class="pag-btn" onclick="S.shopPage=Math.min(${totalPages},S.shopPage+1);shopRefresh()" ${S.shopPage===totalPages?'disabled':''}>Weiter →</button>
        </div>`:''}
      </div>
    </div>
  </div>`;

function shopRefresh(){
  const allCards=filteredCards();
  const perPage=15;
  const totalPages=Math.max(1,Math.ceil(allCards.length/perPage));
  if(S.shopPage>totalPages)S.shopPage=1;
  const cards=allCards.slice((S.shopPage-1)*perPage,S.shopPage*perPage);
  const cg=document.getElementById('cg');
  const rcnt=document.querySelector('.rcnt');
  if(rcnt)rcnt.innerHTML=`<span class="ldot"></span>${allCards.length} Karten gefunden — Seite ${S.shopPage}/${totalPages}`;
  if(cg)cg.innerHTML=cards.length===0?`<div class="empty" style="grid-column:1/-1"><div class="empty-ic">🔍</div><div class="empty-t">Keine Karten gefunden</div></div>`:cards.map(pCard).join('');
}

function pageCard(){

  const seller=S.users.find(u=>u.id===c.sellerId)||{av:'🎴',un:c.seller,ver:false,sales:0,joined:'2024'};
  const inCart=S.cart.some(i=>i.id===c.id);
  const inWl=S.wishlist.includes(c.id);
  const related=S.cards.filter(x=>x.type===c.type&&x.id!==c.id).slice(0,4);
  const alert=S.priceAlerts.find(a=>a.cardId===c.id);
  const avgR=sellerAvgRating(c.sellerId);
  const sellerRevs=S.reviews.filter(r=>r.sellerId===c.sellerId).slice(0,3);
  // Generate fake price history sparkline
  const pts=[];let p=c.price*0.7;
  for(let i=0;i<20;i++){p+=((Math.random()-0.45)*c.price*0.08);p=Math.max(c.price*0.5,p);pts.push(p);}
  pts.push(c.price);
  const minP=Math.min(...pts),maxP=Math.max(...pts);
  const svgPts=pts.map((v,i)=>`${(i/20)*280},${50-((v-minP)/(maxP-minP||1))*45}`).join(' ');
  const hasPurchased=S.orders.some(o=>o.userId===S.user?.id&&o.items.some(i=>i.sellerId===c.sellerId));

            <svg width="100%" height="60" viewBox="0 0 280 60" preserveAspectRatio="none">
              <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0A500" stop-opacity="0.3"/><stop offset="100%" stop-color="#F0A500" stop-opacity="0"/></linearGradient></defs>
              <polygon points="${svgPts} 280,55 0,55" fill="url(#sg)"/>
              <polyline points="${svgPts}" fill="none" stroke="#F0A500" stroke-width="2"/>
            </svg>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--tm);margin-top:0.3rem"><span>Tief: ${fmt(minP)}</span><span style="color:var(--gold);font-weight:700">Aktuell: ${fmt(c.price)}</span><span>Hoch: ${fmt(maxP)}</span></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8rem;margin-top:0.9rem">
          <div style="text-align:center;padding:0.9rem;background:var(--bg2);border-radius:8px;border:1px solid var(--bdr)"><div style="font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;color:var(--gold)">${c.views.toLocaleString()}</div><div style="font-size:0.62rem;color:var(--tm);margin-top:0.2rem;text-transform:uppercase;letter-spacing:1px">Aufrufe</div></div>
          <div style="text-align:center;padding:0.9rem;background:var(--bg2);border-radius:8px;border:1px solid var(--bdr)"><div style="font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;color:#FF6B6B">${c.likes}</div><div style="font-size:0.62rem;color:var(--tm);margin-top:0.2rem;text-transform:uppercase;letter-spacing:1px">Likes</div></div>
          <div style="text-align:center;padding:0.9rem;background:var(--bg2);border-radius:8px;border:1px solid var(--bdr)"><div style="font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;color:${c.stock===0?'var(--red)':'var(--green)'}">${c.stock===0?'Aus':c.stock}</div><div style="font-size:0.62rem;color:var(--tm);margin-top:0.2rem;text-transform:uppercase;letter-spacing:1px">Lager</div></div>
        </div>
      </div>
      <div class="ci-panel">
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.9rem">${rtag(c.rarity)}${ttag(c.type)}${ctag(c.condition)}</div>
        <h1 class="cdn">${c.name}</h1>
        <div class="cdset">${c.set}</div>
        <div class="cdprice">${fmt(c.price)}</div>
        <div class="cdpnote">inkl. MwSt. · zzgl. ${fmt(S.settings.fee/100*c.price)} Servicegebühr (${S.settings.fee}%)</div>
        <div style="display:flex;gap:0.7rem;margin-bottom:1.8rem;flex-wrap:wrap">
          <button class="btn ${inCart?'btng':'btnp'}" style="flex:1;padding:0.85rem" onclick="${inCart?`go('cart')`:`addCart(${c.id})`}" ${c.stock===0?'disabled style="opacity:0.5;cursor:not-allowed"':''}>${c.stock===0?'Ausverkauft':inCart?'→ Zum Warenkorb':'🛒 In den Warenkorb'}</button>
          <button class="btn btno" style="padding:0.85rem 1rem" onclick="toggleWishlist(${c.id},null)">${inWl?'♥ Gemerkt':'♡ Merken'}</button>

          <div><div class="spec-l">HP</div><div class="spec-v">${c.hp}</div></div>

          <div><div class="spec-l">Seltenheit</div><div class="spec-v">${c.rarity}</div></div>
          <div><div class="spec-l">Set</div><div class="spec-v">${c.set}</div></div>
          <div><div class="spec-l">Zustand</div><div class="spec-v">${c.condition}</div></div>

          <div>
            <div class="snm">${seller.un} ${seller.ver?'<span style="font-size:0.65rem;color:var(--green)">✓</span>':''}</div>
            <div class="smt">${seller.sales} Verkäufe${avgR?` · ⭐ ${avgR.toFixed(1)}`:''} · Mitglied seit ${seller.joined||'2024'}</div>

          <div class="stars" style="margin-bottom:0.7rem">${starsHtml(S.reviewRating,true,'')}</div>

}

function pageCart(){
  if(S.cart.length===0)return`<div class="page-in"><div class="empty"><div class="empty-ic">🛒</div><div class="empty-t">Warenkorb ist leer</div><div class="empty-tx">Entdecke Karten im Marktplatz</div><button class="btn btnp" onclick="go('shop')">Zum Marktplatz</button></div></div>`;
  const sub=S.cart.reduce((s,i)=>s+i.price,0);
  const fee=sub*(S.settings.fee/100);
  let total=sub+fee;
  let disc=0;
  if(S.appliedPromo){disc=total*(S.appliedPromo.discount/100);total-=disc;}
  return`<div class="page-in"><div class="cart-l">
    <div>
      <h1 style="font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:700;margin-bottom:1.3rem">Warenkorb <span style="color:var(--gold)">(${S.cart.length})</span></h1>
      ${S.cart.map(i=>{const c=S.cards.find(x=>x.id===i.id);return c?`<div class="citem">
        <div class="citem-em">${c.em}</div>
        <div class="citem-info"><div class="citem-nm">${c.name}</div><div class="citem-mt">${c.set} · ${c.condition}</div></div>
        <div class="citem-pr">${fmt(c.price)}</div>
        <button class="btn btnd" style="padding:0.3rem 0.6rem;font-size:0.72rem;margin-left:0.9rem" onclick="rmCart(${i.id})">✕</button>
      </div>`:''}).join('')}
    </div>
    <div>
      <div class="osum">
        <div class="osum-t">Bestellübersicht</div>
        <div class="sline"><span>Zwischensumme</span><span>${fmt(sub)}</span></div>
        <div class="sline"><span>Servicegebühr (${S.settings.fee}%)</span><span>${fmt(fee)}</span></div>
        ${S.appliedPromo?`<div class="sline" style="color:var(--green)"><span>Rabatt (${S.appliedPromo.code})</span><span>-${fmt(disc)}</span></div>`:''}
        <div class="sline tot"><span>Gesamt</span><span>${fmt(total)}</span></div>
        ${S.user?`<div class="sline" style="font-size:0.78rem"><span style="color:var(--tm)">Dein Guthaben</span><span style="color:${S.user.bal>=total?'var(--green)':'var(--red)'}">${fmt(S.user.bal)}</span></div>`:''}
        <hr class="divl">
        ${S.appliedPromo?`<div class="promo-badge"><span>🎟️ ${S.appliedPromo.code} — ${S.appliedPromo.discount}% Rabatt</span><button onclick="removePromo()" style="background:none;border:none;color:var(--purple);cursor:pointer;font-size:0.75rem">Entfernen</button></div>`:
        `<div class="promo-row"><input id="promo-in" class="promo-in" placeholder="Promo-Code eingeben..." onkeydown="if(event.key==='Enter')applyPromo(document.getElementById('promo-in').value)"><button class="btn btno" style="padding:0.45rem 0.8rem;font-size:0.78rem" onclick="applyPromo(document.getElementById('promo-in').value)">Anwenden</button></div>`}
        <button class="btn btnp" style="width:100%;padding:0.85rem;margin-bottom:0.6rem" onclick="checkout()">💳 Jetzt bezahlen</button>
        ${S.user&&S.user.bal<total?`<button class="btn btno" style="width:100%;padding:0.65rem" onclick="go('wallet')">💰 Guthaben aufladen</button>`:''}
        <div style="font-size:0.72rem;color:var(--tm);text-align:center;margin-top:0.65rem">🔒 Sicher & verschlüsselt · Käuferschutz</div>
      </div>
    </div>
  </div></div>`;
}

function doSell(){

}

  if(!S.user)return`<div class="page-in auth-pg"><div class="acard"><div class="atitle">Login erforderlich</div><button class="btn btnp" style="width:100%;padding:0.85rem" onclick="go('login')">Anmelden</button></div></div>`;
  const conv=S.selConv?S.messages.find(m=>m.id===S.selConv):null;
  return`<div class="page-in"><div style="padding:1.5rem 2rem;max-width:880px;margin:0 auto">
    <h1 style="font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:700;margin-bottom:1.3rem">💬 Nachrichten</h1>
    <div class="msg-layout" style="padding:0">
      <div class="conv-list">
        <div style="padding:0.7rem 1rem;font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--tm);border-bottom:1px solid var(--bdr)">Konversationen</div>
        ${S.messages.map(m=>`<div class="conv-item ${S.selConv===m.id?'act':''}" onclick="S.selConv=${m.id};render()">
          <div class="conv-av">${m.withAv||'🎴'}</div>
          <div style="flex:1;min-width:0"><div class="conv-nm">${m.with}</div><div class="conv-prev">${m.msgs.slice(-1)[0]?.text||'—'}</div></div>
        </div>`).join('')}
        ${S.messages.length===0?'<div style="padding:1.5rem;text-align:center;color:var(--tm);font-size:0.82rem">Noch keine Nachrichten</div>':''}
      </div>
      <div class="chat-area">
        ${conv?`
          <div class="chat-hdr"><div style="font-size:1.2rem">${conv.withAv||'🎴'}</div><div><div style="font-weight:700">${conv.with}</div><div style="font-size:0.72rem;color:var(--green)"><span class="ldot"></span>Online</div></div></div>
          <div class="chat-msgs">
            ${conv.msgs.map(m=>`<div>
              <div class="msg-bubble ${m.from==='me'?'msg-mine':'msg-theirs'}">${m.text}</div>
              <div class="msg-time" style="${m.from==='me'?'text-align:right':''}">${m.time}</div>
            </div>`).join('')}
          </div>
          <div class="chat-input">
            <input id="chat-in" class="chat-in" placeholder="Nachricht eingeben..." onkeydown="if(event.key==='Enter'){sendMsg(this.value);this.value=''}">
            <button class="btn btnp" style="padding:0.55rem 1rem" onclick="const i=document.getElementById('chat-in');sendMsg(i.value);i.value=''">Senden</button>
          </div>`
        :`<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:1rem;color:var(--tm)"><span style="font-size:2.5rem">💬</span><span>Konversation wählen</span></div>`}
      </div>
    </div>
  </div></div>`;
}

function pageAdmin(){
  if(!S.user||S.user.role!=='admin')return`<div class="page-in auth-pg"><div class="acard"><div class="atitle">Kein Zugriff</div><div class="asub">Diese Seite ist nur für Admins</div></div></div>`;
  const totalRev=S.orders.reduce((s,o)=>s+o.total,0);
  const tabs=['overview','users','cards','orders','settings'];
  const tabLabels={overview:'📊 Übersicht',users:'👥 Nutzer',cards:'🃏 Karten',orders:'📦 Bestellungen',settings:'⚙️ Einstellungen'};
  return`<div class="page-in"><div class="admin-l">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.7rem">
      <div><div class="admin-t">⚡ Admin Dashboard</div><div style="font-size:0.82rem;color:var(--tm)">Eingeloggt als ${S.user.un} · ${new Date().toLocaleDateString('de-DE')}</div></div>
      <div style="display:flex;gap:0.5rem">
        <button class="btn ${S.settings.maintenanceMode?'btnd':'btng'}" onclick="toggleMaintenance()">${S.settings.maintenanceMode?'🔧 Wartung AUS':'🔧 Wartungsmodus'}</button>
      </div>
    </div>
    <div class="atabs">${tabs.map(t=>`<div class="atab ${S.adminTab===t?'act':''}" onclick="S.adminTab='${t}';render()">${tabLabels[t]}</div>`).join('')}</div>
    ${S.adminTab==='overview'?`
      <div class="sgrid">
        <div class="sc"><div class="sc-l">Gesamtumsatz</div><div class="sc-n" style="color:var(--gold)">${fmt(totalRev)}</div><div class="sc-c" style="color:var(--green)">+12.4% dieser Monat</div></div>
        <div class="sc"><div class="sc-l">Aktive Nutzer</div><div class="sc-n">${S.users.filter(u=>!u.banned).length}</div><div class="sc-c" style="color:var(--ts)">${S.users.filter(u=>u.banned).length} gesperrt</div></div>
        <div class="sc"><div class="sc-l">Karten verfügbar</div><div class="sc-n">${S.cards.length}</div><div class="sc-c" style="color:var(--blue)">${S.cards.filter(c=>c.feat).length} featured</div></div>
        <div class="sc"><div class="sc-l">Bestellungen</div><div class="sc-n">${S.orders.length}</div><div class="sc-c" style="color:var(--ts)">${S.orders.filter(o=>o.status==='pending').length} ausstehend</div></div>
      </div>
      <div class="sgrid" style="grid-template-columns:repeat(4,1fr)">
        <div class="sc"><div class="sc-l">Merklisten-Einträge</div><div class="sc-n" style="color:var(--purple)">${S.users.reduce((s)=>s,0)+S.wishlist.length}</div></div>
        <div class="sc"><div class="sc-l">Bewertungen</div><div class="sc-n" style="color:#F59E0B">${S.reviews.length}</div></div>
        <div class="sc"><div class="sc-l">Promo-Codes</div><div class="sc-n" style="color:var(--purple)">${S.promoCodes.filter(p=>p.active).length} aktiv</div></div>
        <div class="sc"><div class="sc-l">Servicegebühr</div><div class="sc-n" style="color:var(--green)">${S.settings.fee}%</div></div>
      </div>
      <div class="tblw"><table class="dtbl"><thead><tr><th>Bestellungs-ID</th><th>Betrag</th><th>Status</th><th>Datum</th></tr></thead><tbody>
        ${S.orders.slice(-5).reverse().map(o=>`<tr><td style="color:var(--gold);font-family:'Orbitron',monospace;font-size:0.7rem">${o.id}</td><td>${fmt(o.total)}</td><td><span class="ost ${o.status==='pending'?'st-p':o.status==='shipped'?'st-s':'st-d'}">${o.status==='pending'?'Ausstehend':o.status==='shipped'?'Versendet':'Zugestellt'}</span></td><td>${o.date}</td></tr>`).join('')}
        ${S.orders.length===0?`<tr><td colspan="4" style="text-align:center;color:var(--tm);padding:2rem">Noch keine Bestellungen</td></tr>`:''}
      </tbody></table></div>`
    :S.adminTab==='users'?`
      <div style="margin-bottom:1rem;font-size:0.82rem;color:var(--ts)">💡 Klick auf einen Nutzer-Avatar um das Profil zu sehen. Credits mit + für hinzufügen, - für abziehen.</div>
      <div class="tblw"><table class="dtbl"><thead><tr><th>#</th><th>Nutzer</th><th>E-Mail</th><th>Rolle</th><th>Guthaben</th><th>Verkäufe</th><th>Status</th><th>Aktionen</th></tr></thead><tbody>
        ${S.users.map(u=>`<tr>
          <td style="color:var(--tm);font-size:0.72rem">${u.id}</td>
          <td><div style="display:flex;align-items:center;gap:0.5rem"><span style="font-size:1.2rem">${u.av}</span><div><div style="color:var(--tp);font-weight:600">${u.un}${u.ver?' <span style="color:var(--green);font-size:0.65rem">✓</span>':''}</div></div></div></td>
          <td style="font-size:0.78rem">${u.em}</td>
          <td>
            <select class="ssort" style="padding:2px 5px;font-size:0.72rem" onchange="setRole(${u.id},this.value)" ${u.id===1?'disabled':''}>
              ${['user','seller','admin'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}
            </select>
          </td>
          <td style="color:var(--gold)">${fmt(u.bal)}</td>
          <td>${u.sales}</td>
          <td><span style="color:${u.banned?'var(--red)':'var(--green)'};font-size:0.78rem;font-weight:600">${u.banned?'Gesperrt':'Aktiv'}</span></td>
          <td style="display:flex;gap:0.3rem;flex-wrap:wrap">
            ${u.id!==1?`<button class="abtn ${u.banned?'ab-ok':'ab-ban'}" onclick="toggleBan(${u.id})">${u.banned?'Freigeben':'Sperren'}</button>`:''}
            <button class="abtn ab-ok" onclick="toggleVerify(${u.id})">${u.ver?'Entver.':'Verifizieren'}</button>
            <span style="display:flex;gap:0.2rem;align-items:center">
              <input id="cr-${u.id}" style="width:60px;background:var(--bg3);border:1px solid var(--bdr);border-radius:3px;padding:2px 5px;color:var(--tp);font-size:0.72rem;font-family:monospace" placeholder="±€" type="number" step="0.01">
              <button class="abtn ab-cr" onclick="sendCredits(${u.id},document.getElementById('cr-${u.id}').value)">Credits</button>
            </span>
          </td>
        </tr>`).join('')}
      </tbody></table></div>`
    :S.adminTab==='cards'?`
      <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
        <button class="btn btnp" onclick="go('sell')">+ Karte einstellen</button>
      </div>
      <div class="tblw"><table class="dtbl"><thead><tr><th>Karte</th><th>Set</th><th>Seltenheit</th><th>Preis</th><th>Verkäufer</th><th>Lager</th><th>Aktionen</th></tr></thead><tbody>
        ${S.cards.map(c=>`<tr>
          <td><span style="font-size:1.2rem;margin-right:0.5rem">${c.em}</span><span style="color:var(--tp)">${c.name}</span></td>
          <td>${c.set}</td>
          <td>${rtag(c.rarity)}</td>
          <td style="color:var(--gold)">${fmt(c.price)}</td>
          <td style="cursor:pointer;color:var(--blue)" onclick="showSeller('${c.seller}')">${c.seller}</td>
          <td style="color:${c.stock===0?'var(--red)':c.stock<3?'#F59E0B':'var(--green)'}">${c.stock}</td>
          <td style="display:flex;gap:0.4rem">
            <button class="abtn ab-ft" onclick="toggleFeat(${c.id})">${c.feat?'Unfeature':'Feature'}</button>
            <button class="abtn ab-rm" onclick="removeCard(${c.id})">Löschen</button>
          </td>
        </tr>`).join('')}
      </tbody></table></div>`
    :S.adminTab==='orders'?`
      <div class="tblw"><table class="dtbl"><thead><tr><th>Bestell-ID</th><th>Nutzer</th><th>Artikel</th><th>Gesamt</th><th>Datum</th><th>Status</th><th>Aktion</th></tr></thead><tbody>
        ${S.orders.length===0?`<tr><td colspan="7" style="text-align:center;color:var(--tm);padding:2rem">Noch keine Bestellungen</td></tr>`:S.orders.map(o=>{const u=S.users.find(x=>x.id===o.userId)||{un:'Unbekannt'};return`<tr>
          <td style="color:var(--gold);font-family:'Orbitron',monospace;font-size:0.7rem">${o.id}</td>
          <td>${u.un}</td>
          <td>${o.items.length} Karten</td>
          <td>${fmt(o.total)}</td>
          <td>${o.date}</td>
          <td><span class="ost ${o.status==='pending'?'st-p':o.status==='shipped'?'st-s':'st-d'}">${o.status==='pending'?'Ausstehend':o.status==='shipped'?'Versendet':'Zugestellt'}</span></td>
          <td>${o.status!=='delivered'?`<button class="abtn ab-ok" onclick="advOrder('${o.id}')">Weiter ▶</button>`:''}</td>
        </tr>`;}).join('')}
      </tbody></table></div>`
    :`
      <div class="settings-grid">
        <div class="setting-box">
          <div class="setting-label">Servicegebühr (%)</div>
          <div class="setting-val">${S.settings.fee}%</div>
          <input id="set-fee" class="fi" type="number" min="0" max="30" step="0.5" value="${S.settings.fee}" placeholder="z.B. 5">
        </div>
        <div class="setting-box">
          <div class="setting-label">Max. Listenpreis (€)</div>
          <div class="setting-val">${fmt(S.settings.maxListPrice)}</div>
          <input id="set-maxprice" class="fi" type="number" min="0" step="1" value="${S.settings.maxListPrice}">
        </div>
        <div class="setting-box" style="grid-column:1/-1">
          <div class="setting-label">Ankündigungsbanner</div>
          <input id="set-banner" class="fi" placeholder="z.B. 🎉 Sommer-Sale: 20% auf alle PSA-Karten!" value="${S.settings.banner||''}">
        </div>
      </div>
      <div style="display:flex;gap:0.7rem;margin-bottom:2rem;flex-wrap:wrap">
        <button class="btn btnp" onclick="saveSettings()">Einstellungen speichern</button>
        <div class="toggle" onclick="toggleMaintenance()"><div class="toggle-track ${S.settings.maintenanceMode?'on':''}"><div class="toggle-thumb"></div></div><span class="toggle-lbl">Wartungsmodus</span></div>
        <div class="toggle" onclick="toggleAllowSellers()"><div class="toggle-track ${S.settings.allowSellers?'on':''}"><div class="toggle-thumb"></div></div><span class="toggle-lbl">Verkäufe erlaubt</span></div>
      </div>
      <h3 style="font-family:'Orbitron',monospace;font-size:0.85rem;font-weight:700;margin-bottom:1.1rem;color:var(--gold)">🎟️ Promo-Codes</h3>
      <div style="display:flex;gap:0.7rem;margin-bottom:1.1rem;flex-wrap:wrap">
        <input id="pc-code" class="fi" style="flex:1;min-width:120px" placeholder="Code (z.B. SALE20)">
        <input id="pc-disc" class="fi" style="width:80px" type="number" min="1" max="100" placeholder="% Rabatt">
        <input id="pc-uses" class="fi" style="width:80px" type="number" min="1" placeholder="Max. Nutzungen">
        <button class="btn btnp" onclick="addPromoCode(document.getElementById('pc-code').value,document.getElementById('pc-disc').value,document.getElementById('pc-uses').value)">Erstellen</button>
      </div>
      <div class="tblw"><table class="dtbl"><thead><tr><th>Code</th><th>Rabatt</th><th>Verbleibende Nutzungen</th><th>Status</th><th>Aktionen</th></tr></thead><tbody>
        ${S.promoCodes.map(p=>`<tr>
          <td style="font-family:monospace;font-weight:700;color:var(--purple)">${p.code}</td>
          <td style="color:var(--gold)">${p.discount}%</td>
          <td>${p.uses}</td>
          <td><span style="color:${p.active?'var(--green)':'var(--red)'};font-size:0.78rem;font-weight:600">${p.active?'Aktiv':'Inaktiv'}</span></td>
          <td style="display:flex;gap:0.3rem">
            <button class="abtn ${p.active?'ab-ban':'ab-ok'}" onclick="togglePromo('${p.code}')">${p.active?'Deaktivieren':'Aktivieren'}</button>
            <button class="abtn ab-rm" onclick="deletePromo('${p.code}')">Löschen</button>
          </td>
        </tr>`).join('')}
      </tbody></table></div>`}
  </div></div>`;
}

// ===================== NAV RENDER =====================
function renderNav(){
  const adminEl=document.getElementById('nl-admin');
  if(adminEl)adminEl.style.display=S.user?.role==='admin'?'':'none';
  const msgEl=document.getElementById('nl-messages');
  if(msgEl)msgEl.style.display=S.user?'':'none';
  const nr=document.getElementById('nright');
  if(!nr)return;
  const cartN=S.cart.length;
  const unread=S.notifHistory.filter(n=>!n.read).length;
  const notifDropHtml=S.showNotifDrop?`<div class="notif-drop">
    <div class="notif-drop-hdr"><span class="notif-drop-t">🔔 Benachrichtigungen</span><button class="abtn ab-rm" onclick="S.notifHistory=[];saveState();closeNotifDrop()">Alle löschen</button></div>
    <div class="notif-drop-items">
      ${S.notifHistory.length===0?'<div style="padding:2rem;text-align:center;color:var(--tm);font-size:0.82rem">Keine Benachrichtigungen</div>':S.notifHistory.slice(0,12).map(n=>`<div class="ndrop-item ${n.read?'':'unread'}">
        <div class="ndrop-ic">${n.type==='ok'?'✅':n.type==='err'?'❌':'🔔'}</div>
        <div class="ndrop-body"><div class="ndrop-title">${n.title}</div><div class="ndrop-msg">${n.msg}</div><div class="ndrop-time">${n.time}</div></div>
      </div>`).join('')}
    </div>
  </div>`:'';
  if(S.user){
    nr.innerHTML=`
      <div class="notif-bell" onclick="openNotifDrop()" style="position:relative">
        <span class="notif-bell-ic">🔔</span>
        <span id="bell-badge" class="cbadge" style="display:${unread>0?'flex':'none'}">${unread}</span>
        ${notifDropHtml}
      </div>
      <button class="btn btng" style="position:relative;padding:0.45rem 0.9rem" onclick="go('cart')">🛒${cartN>0?`<span class="cbadge">${cartN}</span>`:''}
      </button>
      <div style="cursor:pointer;display:flex;align-items:center;gap:0.45rem;padding:0.45rem 0.85rem;border-radius:5px;background:var(--bg3);border:1px solid var(--bdr)" onclick="go('profile')">
        <span style="font-size:1rem">${S.user.av}</span>
        <span style="font-size:0.8rem;font-weight:600">${S.user.un}</span>
        ${S.user.role==='admin'?'<span style="font-size:0.62rem;background:rgba(240,165,0,0.2);color:var(--gold);padding:1px 5px;border-radius:2px;font-weight:700">ADMIN</span>':''}
      </div>`;
  } else {
    nr.innerHTML=`<button class="btn btno" onclick="go('login')">Anmelden</button><button class="btn btnp" onclick="go('register')">Registrieren</button>`;
  }
}

const PAGES={home:pageHome,shop:pageShop,card:pageCard,cart:pageCart,login:pageLogin,register:pageRegister,sell:pageSell,orders:pageOrders,profile:pageProfile,admin:pageAdmin,wishlist:pageWishlist,wallet:pageWallet,seller:pageSeller,messages:pageMessages};

function render(){
  const fn=PAGES[S.page]||pageHome;
  document.getElementById('content').innerHTML=fn();
  document.querySelectorAll('.nl').forEach(el=>{el.classList.remove('act');if(el.id==='nl-'+S.page)el.classList.add('act');});
  renderNav();
  // scroll chat to bottom
  if(S.page==='messages'){const ca=document.querySelector('.chat-msgs');if(ca)ca.scrollTop=ca.scrollHeight;}
  // maintenance banner
  document.getElementById('maint-bar').style.display=S.settings.maintenanceMode&&S.user?.role==='admin'?'block':'none';
}

// INIT
renderNav();
render();
</script>
</body>
</html>
